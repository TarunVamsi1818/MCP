[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "example-mcp-server"
version = "0.1.0"
description = "A simple Model Context Protocol (MCP) server example"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3.0",
]

[project.scripts]
example-mcp-server = "mcp_server.server:main"

[tool.setuptools]
packages = ["mcp_server"]
